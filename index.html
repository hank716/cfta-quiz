<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFTA 刷題本</title>
<meta name="description" content="CFTA（Chartered Fintech Associate）自編練習題：419 題章末題、題庫與兩回模擬考。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CFTA 刷題">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1619" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a ledger-style study notebook. Sticky header with tabs, one centered working column (max 820px), big touch targets for iPad. */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --ink: #16262b;
  --muted: #5a6b70;
  --line: #d5dedd;
  --accent: #135a68;
  --accent-ink: #ffffff;
  --accent-soft: #e0eef0;
  --gold: #a26f0c;
  --gold-soft: #f8eed8;
  --ok: #1b7543;
  --ok-soft: #e2f2e8;
  --bad: #b02a20;
  --bad-soft: #fbe6e3;
  --font-body: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1619; --surface: #162226; --ink: #e5eded; --muted: #92a4a7; --line: #2a3b3f;
    --accent: #6fc4d0; --accent-ink: #0b1a1d; --accent-soft: #163a41;
    --gold: #e3b24c; --gold-soft: #3a2e14; --ok: #62cc8f; --ok-soft: #14321f; --bad: #f2877c; --bad-soft: #3d1c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1619; --surface: #162226; --ink: #e5eded; --muted: #92a4a7; --line: #2a3b3f;
  --accent: #6fc4d0; --accent-ink: #0b1a1d; --accent-soft: #163a41;
  --gold: #e3b24c; --gold-soft: #3a2e14; --ok: #62cc8f; --ok-soft: #14321f; --bad: #f2877c; --bad-soft: #3d1c19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.65;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in, .main { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-data); font-weight: 600; font-size: 15px; letter-spacing: .08em; color: var(--accent); margin-right: auto; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 10px 14px; border-radius: 10px; color: var(--muted); font-size: 16px; min-height: 44px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.badge { display: inline-block; min-width: 1.6em; padding: 0 .45em; margin-left: 4px; border-radius: 99px; background: var(--bad-soft); color: var(--bad); font-family: var(--font-data); font-size: 12px; line-height: 1.6; text-align: center; }

.main { padding-block: 24px 64px; display: grid; gap: 20px; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; min-width: 0; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 18px; min-height: 48px; font-size: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* summary numbers */
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fig { display: grid; gap: 2px; }
.fig b { font-family: var(--font-data); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.fig span { font-size: 14px; color: var(--muted); }

/* chapter ledger */
.ledger { display: grid; }
.lrow { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 7.5em 4.5em; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }
.lrow .ch { font-family: var(--font-data); font-weight: 600; color: var(--accent); }
.lrow .name { min-width: 0; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.rate { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.rate.low { color: var(--bad); }
.rate.good { color: var(--ok); }
.cnt { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 16px; min-height: 44px; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; font-weight: 600; }

/* question */
.qhead { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.stem { font-size: 19px; line-height: 1.7; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; min-height: 56px; font-size: 17px; line-height: 1.55; }
.opt .k { font-family: var(--font-data); font-weight: 600; color: var(--muted); padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { color: var(--bad); }
.opt:disabled { cursor: default; color: inherit; }
.verdict { font-weight: 700; font-size: 18px; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--bad); }
.explain { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; display: grid; gap: 6px; }
.ref { font-family: var(--font-data); font-size: 13px; color: var(--gold); }
.navbar { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

/* mock */
.timer { font-family: var(--font-data); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer.warn { color: var(--bad); }
.grid50 { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.cell { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--font-data); font-size: 14px; padding: 0; min-height: 36px; position: relative; }
.cell.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.cell.right { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-soft); }
.cell.wrong { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }
.score { font-family: var(--font-data); font-size: 56px; font-weight: 600; line-height: 1; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.confirm { border: 1.5px solid var(--bad); background: var(--bad-soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* review list */
details.rv { border-top: 1px solid var(--line); padding: 10px 0; }
details.rv summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; min-height: 40px; }
details.rv summary::-webkit-details-marker { display: none; }
details.rv .body { display: grid; gap: 10px; padding: 10px 0 4px; }
.ans-line { font-size: 15px; }
textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); font-family: var(--font-data); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 15px; z-index: 20; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

@media (max-width: 560px) {
  .lrow { grid-template-columns: 2.6em minmax(0, 1fr) 4.2em; }
  .lrow .cnt { display: none; }
  .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fig b { font-size: 22px; }
  .grid50 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .stem { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">CFTA 刷題本</div>
    <nav class="tabs" aria-label="主選單">
      <button class="tab" data-view="home">總覽</button>
      <button class="tab" data-view="practice">練習</button>
      <button class="tab" data-view="mock">模擬考</button>
      <button class="tab" data-view="wrong">錯題本<span class="badge" id="wrongBadge" hidden></span></button>
      <button class="tab" data-view="backup">備份</button>
    </nav>
  </div>
</header>
<main class="main" id="app"><div class="loading">載入題目中…</div></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const CH = {1:"金融科技概論",2:"傳統金融體系",3:"金融科技中的資料",4:"金融服務中的人工智慧",5:"金融服務中的區塊鏈",6:"金融科技資訊安全",7:"全球比較與未來展望",8:"倫理與治理"};
const SRC = {bank:"題庫",mock1:"模擬考第一回",mock2:"模擬考第二回"};
const MOCK_MIN = 75;
const KEY = "cfta-quiz-v1";
let Q = [], QI = {};
let S = load();
let view = "home";
let ui = {};          // transient UI state (not saved)

/* ---------- storage ---------- */
function blank() { return {v:1, q:{}, wrong:{}, mocks:[], run:null, sess:null, prefs:{}}; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return Object.assign(blank(), s); } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} updateBadge(); }

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function srcLabel(q) { return q.source.startsWith("ch") ? `CH${q.chapter} 章末 Q${q.n}` : `${SRC[q.source]} Q${q.n}`; }
function pct(a, b) { return b ? Math.round(a / b * 100) : null; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }
function fmtDate(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

function record(id, pick) {
  const q = QI[id], ok = pick === q.answer;
  const r = S.q[id] || (S.q[id] = {n: 0, c: 0});
  r.n++; if (ok) r.c++; r.last = pick; r.ok = ok; r.t = Date.now();
  if (!ok) S.wrong[id] = 0;
  else if (id in S.wrong) { S.wrong[id]++; if (S.wrong[id] >= 2) delete S.wrong[id]; }
  return ok;
}
function updateBadge() {
  const n = Object.keys(S.wrong).length, b = $("#wrongBadge");
  b.hidden = !n; b.textContent = n;
}

/* ---------- navigation ---------- */
function go(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(t => t.removeAttribute("aria-current"));
  const tabFor = {quiz: "practice", summary: "practice", mockrun: "mock", mockres: "mock"}[v] || v;
  const t2 = document.querySelector(`.tab[data-view="${tabFor}"]`);
  if (t2) t2.setAttribute("aria-current", "page");
  try { if (["home","practice","mock","wrong","backup"].includes(v)) history.replaceState(null, "", "#" + v); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  const v = t.dataset.view;
  if (v === "mock" && S.run) return go("mockrun");
  go(v);
}));

function render() {
  const app = $("#app");
  stopTimer();
  ({home: vHome, practice: vPractice, quiz: vQuiz, summary: vSummary, mock: vMock, mockrun: vMockRun, mockres: vMockRes, wrong: vWrong, backup: vBackup}[view] || vHome)(app);
}

/* ---------- stats ---------- */
function chapterStats(ch) {
  const qs = Q.filter(q => q.chapter === ch);
  let done = 0, ok = 0, wrong = 0;
  for (const q of qs) { const r = S.q[q.id]; if (r) { done++; if (r.ok) ok++; } if (q.id in S.wrong) wrong++; }
  return {total: qs.length, done, ok, wrong, rate: pct(ok, done)};
}

/* ---------- views: home ---------- */
function vHome(app) {
  const all = Object.keys(S.q).filter(id => QI[id]);
  const ok = all.filter(id => S.q[id].ok).length;
  const nWrong = Object.keys(S.wrong).length;
  const lastMock = S.mocks[S.mocks.length - 1];
  let rows = "";
  for (let c = 1; c <= 8; c++) {
    const s = chapterStats(c);
    const cls = s.rate == null ? "" : s.rate < 70 ? "low" : s.rate >= 80 ? "good" : "";
    rows += `<div class="lrow">
      <div class="ch">CH${c}</div>
      <div class="name"><div>${CH[c]}</div><div class="meter" aria-hidden="true"><i style="width:${pct(s.done, s.total)}%"></i></div></div>
      <div class="cnt">${s.done}/${s.total} 題${s.wrong ? ` · 錯 ${s.wrong}` : ""}</div>
      <div class="rate ${cls}">${s.rate == null ? "—" : s.rate + "%"}</div>
    </div>`;
  }
  const resume = S.sess && S.sess.i < S.sess.ids.length;
  app.innerHTML = `
    <div class="stack">
      <p class="eyebrow">Chartered Fintech Associate</p>
      <h1>今天要練哪一章？</h1>
    </div>
    ${S.run ? `<div class="panel"><div class="row"><span class="pill gold">進行中</span><b>${SRC[S.run.exam]}</b><span class="muted small">剩 ${fmtTime((S.run.deadline - Date.now()) / 1000)}</span></div><div class="row"><button class="btn primary" id="goRun">回到考試</button></div></div>` : ""}
    ${resume ? `<div class="panel"><div class="row"><span class="pill gold">未完成</span><span>練習到第 ${S.sess.i + 1} / ${S.sess.ids.length} 題</span></div><div class="row"><button class="btn primary" id="goSess">繼續練習</button><button class="btn ghost" id="dropSess">放棄這輪</button></div></div>` : ""}
    <section class="panel">
      <div class="figs">
        <div class="fig"><b>${all.length}<small class="muted" style="font-size:15px"> / ${Q.length}</small></b><span>做過的題目</span></div>
        <div class="fig"><b>${all.length ? pct(ok, all.length) + "%" : "—"}</b><span>最近一次答對率</span></div>
        <div class="fig"><b>${lastMock ? lastMock.score : "—"}</b><span>上次模擬考分數</span></div>
      </div>
    </section>
    <section class="panel">
      <div class="qhead"><h2>各章進度</h2><span class="muted small">答對率低於 70% 標紅</span></div>
      <div class="ledger">${rows}</div>
    </section>
    <div class="row">
      <button class="btn primary" id="hPractice">開始練習</button>
      <button class="btn" id="hMock">模擬考</button>
      ${nWrong ? `<button class="btn" id="hWrong">練錯題（${nWrong}）</button>` : ""}
    </div>
    <p class="muted small">進度只存在這台裝置的瀏覽器裡。換裝置或清除 Safari 資料前，請先到「備份」匯出。</p>`;
  $("#hPractice").onclick = () => go("practice");
  $("#hMock").onclick = () => go(S.run ? "mockrun" : "mock");
  if (nWrong) $("#hWrong").onclick = () => startSession(shuffle(Object.keys(S.wrong)), "錯題本");
  if (S.run) $("#goRun").onclick = () => go("mockrun");
  if (resume) { $("#goSess").onclick = () => go("quiz"); $("#dropSess").onclick = () => { S.sess = null; save(); render(); }; }
}

/* ---------- views: practice setup ---------- */
function vPractice(app) {
  const p = ui.p || (ui.p = Object.assign({chs: [1,2,3,4,5,6,7,8], src: "all", filter: "all", order: "random", count: 0}, S.prefs.practice || {}));
  const pool = () => Q.filter(q => {
    if (q.source.startsWith("mock")) return false;
    if (!p.chs.includes(q.chapter)) return false;
    if (p.src === "ch" && !q.source.startsWith("ch")) return false;
    if (p.src === "bank" && q.source !== "bank") return false;
    const r = S.q[q.id];
    if (p.filter === "new" && r) return false;
    if (p.filter === "wrong" && !(r && !r.ok)) return false;
    return true;
  });
  const chip = (group, val, label, on) => `<button class="chip" data-g="${group}" data-v="${val}" aria-pressed="${on}">${label}</button>`;
  const opts = (group, list) => list.map(([v, l]) => chip(group, v, l, p[group] === v)).join("");
  const n = pool().length;
  const take = p.count ? Math.min(p.count, n) : n;
  app.innerHTML = `
    <h1>練習</h1>
    <section class="panel">
      <fieldset><legend>章節</legend>
        <div class="chips">${Object.keys(CH).map(c => chip("chs", c, `CH${c} ${CH[c]}`, p.chs.includes(+c))).join("")}</div>
        <div class="row"><button class="btn ghost" id="allCh">全選</button><button class="btn ghost" id="noCh">全不選</button></div>
      </fieldset>
      <fieldset><legend>題目來源</legend><div class="chips">${opts("src", [["all","章末題＋題庫"],["ch","只做章末題"],["bank","只做題庫"]])}</div></fieldset>
      <fieldset><legend>範圍</legend><div class="chips">${opts("filter", [["all","全部"],["new","沒做過的"],["wrong","上次答錯的"]])}</div></fieldset>
      <fieldset><legend>順序</legend><div class="chips">${opts("order", [["random","隨機"],["seq","依題號"]])}</div></fieldset>
      <fieldset><legend>題數</legend><div class="chips">${[[0,"全部"],[10,"10 題"],[20,"20 題"],[30,"30 題"]].map(([v,l]) => chip("count", v, l, p.count === v)).join("")}</div></fieldset>
      <p class="muted small">模擬考的 100 題不會出現在這裡，留到模擬考再做。</p>
    </section>
    <div class="row"><button class="btn primary" id="start" ${take ? "" : "disabled"}>開始練習 ${take} 題</button>${n ? "" : `<span class="muted">沒有符合條件的題目</span>`}</div>`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const g = b.dataset.g, v = b.dataset.v;
    if (g === "chs") { const c = +v; p.chs = p.chs.includes(c) ? p.chs.filter(x => x !== c) : p.chs.concat(c).sort(); }
    else p[g] = g === "count" ? +v : v;
    render();
  });
  $("#allCh").onclick = () => { p.chs = [1,2,3,4,5,6,7,8]; render(); };
  $("#noCh").onclick = () => { p.chs = []; render(); };
  $("#start").onclick = () => {
    let ids = pool();
    if (p.order === "random") ids = shuffle(ids);
    else ids.sort((a, b) => a.chapter - b.chapter || (a.source === "bank") - (b.source === "bank") || a.n - b.n);
    if (p.count) ids = ids.slice(0, p.count);
    S.prefs.practice = Object.assign({}, p);
    startSession(ids.map(q => q.id), "練習");
  };
}

function startSession(ids, label) {
  S.sess = {ids, i: 0, picks: {}, label};
  save(); go("quiz");
}

/* ---------- views: quiz runner ---------- */
function vQuiz(app) {
  const s = S.sess;
  if (!s || !s.ids.length) return go("practice");
  if (s.i >= s.ids.length) return go("summary");
  const id = s.ids[s.i], q = QI[id];
  if (!q) { s.i++; save(); return render(); }
  const pick = s.picks[id];
  const answered = pick != null;
  const optHtml = q.options.map((o, k) => {
    const L = "ABCD"[k];
    let cls = "";
    if (answered) { if (L === q.answer) cls = "right"; else if (L === pick) cls = "wrong"; }
    return `<button class="opt ${cls}" data-k="${L}" ${answered ? "disabled" : ""}><span class="k">${L}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const ok = pick === q.answer;
  app.innerHTML = `
    <div class="stack">
      <div class="qhead"><span class="eyebrow">${esc(s.label)} · 第 ${s.i + 1} / ${s.ids.length} 題</span><button class="btn ghost" id="quit">結束</button></div>
      <div class="progress" aria-hidden="true"><i style="width:${(s.i + (answered ? 1 : 0)) / s.ids.length * 100}%"></i></div>
    </div>
    <article class="panel">
      <div class="row"><span class="pill gold">${srcLabel(q)}</span><span class="muted small">${CH[q.chapter]}</span>${id in S.wrong ? `<span class="pill bad">錯題本</span>` : ""}</div>
      <p class="stem">${rich(q.stem)}</p>
      <div class="opts">${optHtml}</div>
      ${answered ? `
        <p class="verdict ${ok ? "ok" : "no"}">${ok ? "答對了" : `答錯了，正確答案是 ${q.answer}`}</p>
        <div class="explain"><p>${rich(q.explain.replace(/〔[^〕]*〕/g, "").trim())}</p>${q.ref ? `<span class="ref">原書 ${esc(q.ref)}</span>` : ""}</div>` : ""}
    </article>
    <div class="navbar">
      <button class="btn" id="prev" ${s.i ? "" : "disabled"}>上一題</button>
      <button class="btn primary" id="next" ${answered ? "" : "disabled"}>${s.i + 1 === s.ids.length ? "看結果" : "下一題"}</button>
    </div>
    <p class="muted small">有鍵盤的話：1–4 或 A–D 作答，Enter 下一題。</p>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b.dataset.k));
  $("#next").onclick = next;
  $("#prev").onclick = () => { s.i--; save(); render(); };
  $("#quit").onclick = () => go("summary");
}
function answer(L) {
  const s = S.sess, id = s.ids[s.i];
  if (s.picks[id] != null) return;
  s.picks[id] = L; record(id, L); save(); render();
  const v = $(".verdict"); if (v) v.scrollIntoView({block: "nearest", behavior: "smooth"});
}
function next() {
  const s = S.sess; if (s.picks[s.ids[s.i]] == null) return;
  s.i++; save(); render(); window.scrollTo(0, 0);
}

function vSummary(app) {
  const s = S.sess;
  if (!s) return go("practice");
  const done = s.ids.filter(id => s.picks[id] != null);
  const wrong = done.filter(id => s.picks[id] !== QI[id].answer);
  const rate = pct(done.length - wrong.length, done.length);
  app.innerHTML = `
    <h1>這輪結果</h1>
    <section class="panel">
      <div class="figs">
        <div class="fig"><b>${done.length}</b><span>作答題數</span></div>
        <div class="fig"><b>${done.length - wrong.length}</b><span>答對</span></div>
        <div class="fig"><b>${rate == null ? "—" : rate + "%"}</b><span>答對率</span></div>
      </div>
    </section>
    ${wrong.length ? `<section class="panel"><h2>答錯的題目</h2><div>${wrong.map(id => reviewItem(QI[id], s.picks[id])).join("")}</div></section>` : done.length ? `<p>全部答對。</p>` : ""}
    <div class="row">
      ${wrong.length ? `<button class="btn primary" id="again">再練這 ${wrong.length} 題</button>` : ""}
      <button class="btn" id="home">回總覽</button>
      <button class="btn" id="more">再練一輪</button>
    </div>`;
  if (wrong.length) $("#again").onclick = () => startSession(shuffle(wrong), "訂正");
  $("#home").onclick = () => { S.sess = null; save(); go("home"); };
  $("#more").onclick = () => { S.sess = null; save(); go("practice"); };
}

function reviewItem(q, pick, open) {
  const ok = pick === q.answer;
  return `<details class="rv" ${open ? "open" : ""}>
    <summary><span class="data muted">${q.source.startsWith("mock") ? "Q" + q.n : "CH" + q.chapter}</span><span>${esc(q.stem)}</span><span class="pill ${ok ? "ok" : "bad"}">${pick ? pick : "未答"} → ${q.answer}</span></summary>
    <div class="body">
      <p class="muted small">${srcLabel(q)} · ${CH[q.chapter]}</p>
      <div class="ans-line">${q.options.map((o, k) => { const L = "ABCD"[k]; return `<div${L === q.answer ? ` style="color:var(--ok);font-weight:600"` : L === pick ? ` style="color:var(--bad)"` : ""}>${L}. ${esc(o)}</div>`; }).join("")}</div>
      <div class="explain"><p>${rich(q.explain.replace(/〔[^〕]*〕/g, "").trim())}</p>${q.ref ? `<span class="ref">原書 ${esc(q.ref)}</span>` : ""}</div>
    </div>
  </details>`;
}

/* ---------- views: mock ---------- */
function vMock(app) {
  const hist = S.mocks.slice().reverse();
  const card = (k, desc) => {
    const best = S.mocks.filter(m => m.exam === k).reduce((b, m) => Math.max(b, m.score), -1);
    return `<section class="panel">
      <div class="qhead"><h2>${SRC[k]}</h2>${best >= 0 ? `<span class="pill ${best >= 80 ? "ok" : best >= 70 ? "gold" : "bad"}">最高 ${best} 分</span>` : `<span class="muted small">還沒考過</span>`}</div>
      <p class="muted">${desc}</p>
      <div class="row"><button class="btn primary" data-exam="${k}">開始作答</button></div>
    </section>`;
  };
  app.innerHTML = `
    <h1>模擬考</h1>
    <p class="muted">50 題單選、跨章混合，${MOCK_MIN} 分鐘，每題 2 分。考試中不顯示對錯，交卷後才看分數和詳解。≥ 80 分代表準備充分。</p>
    ${card("mock1", "依原書範例題難度出題。")}
    ${card("mock2", "比第一回難一些，情境題比例較高。")}
    ${hist.length ? `<section class="panel"><h2>考試紀錄</h2><div class="table-wrap"><table>
      <thead><tr><th>時間</th><th>回次</th><th class="num">分數</th><th class="num">用時</th></tr></thead>
      <tbody>${hist.map(m => `<tr><td class="data">${fmtDate(m.date)}</td><td>${SRC[m.exam]}</td><td class="num">${m.score}</td><td class="num">${fmtTime(m.secs)}</td></tr>`).join("")}</tbody>
    </table></div></section>` : ""}`;
  app.querySelectorAll("[data-exam]").forEach(b => b.onclick = () => {
    const ids = Q.filter(q => q.source === b.dataset.exam).sort((a, c) => a.n - c.n).map(q => q.id);
    S.run = {exam: b.dataset.exam, ids, start: Date.now(), deadline: Date.now() + MOCK_MIN * 60000, ans: {}, flags: {}, cur: 0};
    save(); go("mockrun");
  });
}

let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function vMockRun(app) {

  app.innerHTML = `
    <div class="panel">
      <div class="qhead">
        <div class="row"><span class="timer" id="timer">${fmtTime((r.deadline - Date.now()) / 1000)}</span><span class="muted small">已答 ${nDone} / 50</span></div>

    </div>

      <div class="row"><span class="pill gold">第 ${r.cur + 1} 題</span><button class="chip" id="flag" aria-pressed="${!!r.flags[q.id]}">${r.flags[q.id] ? "已標記" : "標記稍後再看"}</button></div>
      <p class="stem">${rich(q.stem)}</p>
      <div class="opts">${q.options.map((o, k) => { const L = "ABCD"[k]; return `<button class="opt ${pick === L ? "sel" : ""}" data-k="${L}"><span class="k">${L}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
    </article>

      <button class="btn" id="prev" ${r.cur ? "" : "disabled"}>上一題</button>

      <div class="grid50">${r.ids.map((id, i) => `<button class="cell ${r.ans[id] ? "done" : ""} ${i === r.cur ? "cur" : ""} ${r.flags[id] ? "flag" : ""}" data-i="${i}" aria-label="第 ${i + 1} 題">${i + 1}</button>`).join("")}</div>
    </section>
    <div class="row"><button class="btn ghost" id="abandon">放棄這次考試</button></div>
    <div id="abandonBox" hidden></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    r.ans[q.id] = b.dataset.k; save();

  });
  app.querySelectorAll(".cell").forEach(b => b.onclick = () => { r.cur = +b.dataset.i; save(); render(); });
  $("#prev").onclick = () => { r.cur--; save(); render(); };
  $("#next").onclick = () => { r.cur++; save(); render(); };
  $("#flag").onclick = () => { if (r.flags[q.id]) delete r.flags[q.id]; else r.flags[q.id] = 1; save(); render(); };
  $("#submit").onclick = () => {
    const left = 50 - Object.keys(r.ans).length, box = $("#confirmBox");
    box.hidden = false;
    box.innerHTML = `<div class="confirm"><p>${left ? `還有 <b>${left}</b> 題沒作答，未答會算錯。` : "50 題都答完了。"}確定要交卷嗎？</p><div class="row"><button class="btn primary" id="yes">確定交卷</button><button class="btn" id="no">繼續作答</button></div></div>`;
    $("#yes").onclick = () => submitMock(false);
    $("#no").onclick = () => { box.hidden = true; };
  };
  $("#abandon").onclick = () => {
    const box = $("#abandonBox"); box.hidden = false;
    box.innerHTML = `<div class="confirm"><p>放棄後這次的作答不會留下紀錄。</p><div class="row"><button class="btn danger" id="ab2">確定放棄</button><button class="btn" id="ab3">取消</button></div></div>`;
    $("#ab2").onclick = () => { S.run = null; save(); go("mock"); };
    $("#ab3").onclick = () => { box.hidden = true; };
  };
  timerId = setInterval(() => {
    const left = (r.deadline - Date.now()) / 1000, t = $("#timer");
    if (left <= 0) { stopTimer(); submitMock(true); return; }
    if (t) { t.textContent = fmtTime(left); t.classList.toggle("warn", left < 300); }
  }, 1000);
}
function submitMock(timeUp) {
  const r = S.run; if (!r) return;
  stopTimer();
  let correct = 0;
  for (const id of r.ids) {
    const pick = r.ans[id];
    if (pick) { if (record(id, pick)) correct++; }
    else S.wrong[id] = 0;
  }
  const res = {exam: r.exam, ids: r.ids, ans: r.ans, score: correct * 2, correct, date: Date.now(), secs: Math.min(MOCK_MIN * 60, (Date.now() - r.start) / 1000), timeUp};
  S.mocks.push({exam: res.exam, score: res.score, date: res.date, secs: res.secs});
  S.lastMock = res; S.run = null; save();
  if (timeUp) toast("時間到，已自動交卷");
  go("mockres");
}

  const verdict = r.score >= 80 ? ["ok", "準備充分"] : r.score >= 70 ? ["gold", "再複習弱項章節"] : ["bad", "回到各章重點整理與陷阱表重讀"];
  const f = ui.resFilter || "wrong";

  app.innerHTML = `
    <h1>${SRC[r.exam]} 成績</h1>
    <section class="panel">
      <div class="row" style="gap:20px;align-items:flex-end"><span class="score">${r.score}</span><div class="stack" style="gap:4px"><span class="pill ${verdict[0]}">${verdict[1]}</span><span class="muted small">答對 ${r.correct} / 50 · 用時 ${fmtTime(r.secs)}${r.timeUp ? " · 時間到自動交卷" : ""}</span></div></div>
      <div class="grid50">${r.ids.map((id, i) => `<span class="cell ${r.ans[id] === QI[id].answer ? "right" : "wrong"}" style="display:grid;place-items:center">${i + 1}</span>`).join("")}</div>
    </section>
    <section class="panel">
      <h2>章節診斷</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>章節</th><th class="num">答對</th><th class="num">答對率</th><th></th></tr></thead>
        <tbody>${Object.keys(byCh).sort((a, b) => a - b).map(c => { const x = byCh[c], p = pct(x.ok, x.n); return `<tr><td>CH${c} ${CH[c]}</td><td class="num">${x.ok}/${x.n}</td><td class="num">${p}%</td><td>${p < 70 ? `<span class="pill bad">弱項</span>` : ""}</td></tr>`; }).join("")}</tbody>
      </table></div>
      <p class="muted small">答對率低於 70% 的章節，建議回去讀該章「重點整理」和「常考陷阱」，再到練習做那一章的題庫。答錯和沒答的題目已加入錯題本。</p>
    </section>
    <section class="panel">
      <div class="qhead"><h2>詳解</h2><div class="chips"><button class="chip" data-f="wrong" aria-pressed="${f === "wrong"}">只看錯題</button><button class="chip" data-f="all" aria-pressed="${f === "all"}">全部 50 題</button></div></div>
      <div>${list.length ? list.map(q => reviewItem(q, r.ans[q.id])).join("") : `<p class="muted">沒有錯題。</p>`}</div>
    </section>
    <div class="row"><button class="btn primary" id="toWrong">去錯題本</button><button class="btn" id="toMock">回模擬考</button></div>`;
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.resFilter = b.dataset.f; render(); });
  $("#toWrong").onclick = () => go("wrong");

      delete d.exported;
      S = Object.assign(blank(), d); save();
      msg.style.color = "var(--ok)"; msg.textContent = `匯入完成：${Object.keys(S.q).length} 題紀錄、${S.mocks.length} 次模擬考。`;
    } catch (e) { msg.style.color = "var(--bad)"; msg.textContent = "看不懂這份內容。請確認是從這個網站匯出的完整備份。"; }
  };
  $("#reset").onclick = () => {
    const box = $("#resetBox"); box.hidden = false;
    box.innerHTML = `<div class="confirm"><p>所有作答紀錄、錯題本和模擬考成績都會刪除，無法復原。</p><div class="row"><button class="btn danger" id="r2">確定清除</button><button class="btn" id="r3">取消</button></div></div>`;
    $("#r2").onclick = () => { S = blank(); save(); toast("已清除"); go("home"); };
    $("#r3").onclick = () => { box.hidden = true; };
  };
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "ABCD".indexOf(k);
  if (view === "quiz") {
    if (idx >= 0 && k.length === 1) answer("ABCD"[idx]);
    else if (e.key === "Enter" || e.key === "ArrowRight") next();
  } else if (view === "mockrun" && S.run) {
    const r = S.run;
    if (idx >= 0 && k.length === 1) { r.ans[r.ids[r.cur]] = "ABCD"[idx]; if (r.cur < 49) r.cur++; save(); render(); }
    else if (e.key === "ArrowRight" && r.cur < 49) { r.cur++; save(); render(); }
    else if (e.key === "ArrowLeft" && r.cur > 0) { r.cur--; save(); render(); }
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && view === "mockrun") render(); });

/* ---------- boot ---------- */
fetch("questions.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  Q = data; QI = Object.fromEntries(Q.map(q => [q.id, q]));
  updateBadge();
  const h = (location.hash || "").slice(1);
  go(S.run ? "mockrun" : ["home","practice","mock","wrong","backup"].includes(h) ? h : "home");
}).catch(() => {
  $("#app").innerHTML = `<section class="panel"><h2>題目載入失敗</h2><p class="muted">請確認網路連線後重新整理頁面。</p><div class="row"><button class="btn primary" onclick="location.reload()">重新整理</button></div></section>`;
});
</script>
</body>
</html>
